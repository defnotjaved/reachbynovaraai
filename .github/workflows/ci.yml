name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend lint
        working-directory: backend
        run: |
          npm ci
          npm run lint
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Positioning language check
        run: bash scripts/check-positioning.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

  migrate-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply all migrations to ephemeral Postgres
        working-directory: db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/reach
        run: |
          npm ci
          node run-migration.js
